# The .road section, driven the way the reference drives its phases: name,
# status (ready | active), blurb. The template shows the first sentence.
# "active" is used for what is NOT yet done, which is what the repos' own
# READMEs call "Not yet".
[[params.phases]]
  name = "The factors"
  status = "ready"
  blurb = "`fido` speaks CTAPHID to a security key over any transport, `totp` is RFC 6238 with the replay refusal the RFC requires, and `mfa` counts answers by KIND rather than by number. `keyfactor` is the piece between them."
[[params.phases]]
  name = "The directory"
  status = "ready"
  blurb = "`directory` is one model over a database, an LDAP server or the configuration file itself, carrying what PROVES each person rather than a password field. `authnd` serves it back out over LDAP, because almost everything speaks LDAP."
[[params.phases]]
  name = "Kerberos, both halves"
  status = "ready"
  blurb = "`kdc` issues AS-REQ and TGS-REQ from that same directory, and since v0.12.0 puts a PAC a Samba member server accepts in the tickets of services you name. MIT's own kinit judges it. The PAC (`Config.PAC`) comes from the directory's uidNumber and gidNumber; a reply too big for UDP is answered with `KRB_ERR_RESPONSE_TOO_BIG` so the client retries over TCP. `krb5` accepts an AP-REQ and answers with the AP-REP gokrb5 will not build, then signs and seals for sec=krb5, krb5i and krb5p."
[[params.phases]]
  name = "A KDC you can run"
  status = "ready"
  blurb = "`kdcd` has no password path: an AS-REQ for a person is refused by design. A TGT comes only through the mutual-TLS mint listener, after a passkey login at `bridge`; the directories only say who exists. It runs `kdc` on UDP and TCP, on the loopback by default, configured in HCL, with keys from a keytab file that must not be readable by group or other, and `kdcd check` validates the configuration."
[[params.phases]]
  name = "The platform's own factors"
  status = "ready"
  blurb = "go-macos/factors, go-gnulinux/factors and go-mswin/factors hand Touch ID, a key over hidraw and Windows Hello to `mfa` as factors. Neither Hello nor Touch ID is FIDO, which is why kinds are counted."
[[params.phases]]
  name = "OIDC at the bind"
  status = "ready"
  blurb = "A token goes where the protocol has a place for it: SASL OAUTHBEARER (RFC 7628), not the password field, which the `mfa` block already uses for the code. How many factors a token is worth is whatever the issuer says it checked in `amr` -- that is the only evidence there is, so a token with none is one factor and a two-factor policy refuses it."
[[params.phases]]
  name = "A federation behind OpenID Connect"
  status = "ready"
  blurb = "`saml` is the service provider RENATER and eduGAIN talk to, `bridge` the OpenID Connect provider in front of it, so that go-fileshare and anything else that speaks OIDC reaches every university in the federation. A token over WebDAV, a certificate over SFTP -- the provider's own or an opkssh one -- a Kerberos ticket for SMB, temporary credentials from an STS for S3. No password of any kind: since v0.30.0 the provider issues none. Since v0.39.0 an administrator can invite a local account from the web, but only with a passkey whose model is proved by a verified attestation and checked against the FIDO metadata."
[[params.phases]]
  name = "Provisioning from the identity provider"
  status = "ready"
  blurb = "`scim` lets Entra ID or Okta provision people and groups in your application (RFC 7643, RFC 7644), over a `Backend` you write. Entra ID's and Okta's own payloads are tested, and go-llmflow's gateway uses it to provision its administrators."
[[params.phases]]
  name = "Revocation that reaches every server"
  status = "ready"
  blurb = "`bridge` signs its KRL and CRL and dates them, `authn-revokd` verifies each before any server sees it, refuses an older one after a newer, and fails closed for sshd when the list lapses. Copying list files by hand does not scale, and a mirror in between is trusted for nothing."
[[params.phases]]
  name = "A VPN on the same identity"
  status = "ready"
  blurb = "`bridge` keeps whose each WireGuard key is: a person's VPN client registers its device's public key with a token, for a lease, and disabling the person or their institution takes the keys back with their certificates. A gateway -- claimward's, first -- reads the live keys as a list signed for it alone, through `wireguard`, and enrolls a device only if its owner registered it. WireGuard itself has no certificates, no expiry and no revocation, which is why the answer has to live outside it."
[[params.phases]]
  name = "The EuroHPC SSH CA profile"
  status = "ready"
  blurb = "`bridge` issues, per client, certificates in the profile of the EuroHPC Federation Platform's SSH CA: one principal from a chosen claim (`voperson_id` for the MyAccessID CUID), the permit-* a shell needs, `source-address`, a short validity, and the domain grant naming the hosting entity's hosts, encoded by `sshcert`. A site trusts the key from `/ssh/config` as EFP documents, and go-fileshare refuses a certificate not granted to it. Unlike GÉANT's tool, ours fail closed when the grant is missing, and the bridge keeps a KRL, which EFP documents none of."
[[params.phases]]
  name = "A certificate for a server nobody can reach"
  status = "ready"
  blurb = "`servercert` proves a name with dns-01 (RFC 8555 §8.4), a TXT record published through a two-method provider, so a server on a private LAN address gets a publicly trusted certificate, wildcards included, with no inbound port. `rfc2136` is the provider for a name server that takes TSIG-signed dynamic updates (RFC 2136, RFC 8945); its credentials are read from a 0600 file, never a command line. Judged by pebble, Let's Encrypt's own test CA, including a wrong TXT record that must be refused."
[[params.phases]]
  name = "Writes through the LDAP surface"
  status = "active"
  blurb = "A person can change their own password in `authnd`, with the current one (RFC 3062, or a modify of their own `userPassword`), and nothing else is written: add, delete and modifyDN are deliberately not wired, and the obstacle is now policy rather than shape. `go-authn/ldap` carries a modify as an ORDERED list (RFC 4511 4.6), so `delete member; add member` and `add member; delete member` are no longer the same request; and it answers the read entry controls (RFC 4527), so a write can report the entry before and after -- which a client changing a group membership needs in order to know what it actually wrote."

[[params.phases]]
  name = "Secrets from a reference"
  status = "ready"
  blurb = "`secretsource` reads a PIN from KeePassXC, Keychain, a Secret Service or a systemd credential; `file:` refuses symlinks; `secretflag` adds `--<name>-from`. Since v0.9.0 `file:` refuses a symbolic link or a file owned by another account; `secretsource/secretflag` (v0.10.0) replaces a secret flag, visible in `ps`, by `--<name>-from <ref>`. No plaintext file is needed: `secretsource store` writes it. It resolves a PIN, a password or a recovery code from a reference (`file:`, `keychain:` on macOS, `secretservice:` for GNOME Keyring, KWallet or KeePassXC on Linux, `keepassxc:` through KeePassXC's browser integration, `systemd-creds:` for a systemd credential on Linux, since v0.8.0). No scheme runs a command. `fido --pin-from` and `theca --pin-from` read their secrets this way."

[[params.phases]]
  name = "Systemd credentials without systemd"
  status = "ready"
  blurb = "`sdcreds` (v0.4.1) reads and writes systemd credentials from Go, `s6-run --keep-cap` keeps a capability from an allowlist of seven, and `sdcreds run` delivers them to a service on OpenBSD too. It reads and writes the systemd credential format (`systemd-creds encrypt` / `decrypt`) from Go, with a command line and a helper that gives an s6-supervised service the `$CREDENTIALS_DIRECTORY` that `LoadCredentialEncrypted=` gives a systemd unit. Install: `go install github.com/go-authn/sdcreds/cmd/sdcreds@latest`. Supported keys are null, host and host-scoped; TPM2 and public-key credentials are recognised and refused with `*UnsupportedModeError`, nothing is guessed. Both directions are tested against the real `systemd-creds` 262.2. `sdcreds s6-run` decrypts every credential before mounting a per-service `tmpfs`, writes the plaintext 0400 for the service user and starts the service in a child that drops privileges (`--keep-cap` keeps capabilities named from an allowlist of seven, none by default); `sdcreds s6-finish` unmounts it. Linux only for `s6-run`. `sdcreds run` does the same on OpenBSD, where the files live in a memory file system for the service and are zeroed at the end: it refuses root as the service user and refuses to start unless swap is encrypted, and killing sdcreds, even with SIGKILL, kills the program and unmounts, with a killer that no process of the service user can signal, a kill lock per user, and reserved exit statuses (125 refused, 126 failed, 70 release failed, whatever the program's own status). There is no mount namespace there, so the credentials are visible to every process that can reach the directory."

[[params.phases]]
  name = "Shared hardening"
  status = "ready"
  blurb = "`harden` keeps a key out of swap, and a lock the system refuses is an error, never a silent success. Since v0.3.0 its `memlock` uses `mlock` on Linux, macOS and the BSDs and `VirtualLock` on Windows: `Lock` returns an error when the system refuses and leaves nothing locked; `LockBestEffort` is the only quiet mode and its name says so; any other platform gets a typed `UnsupportedError`. `DisableDumps` sets `RLIMIT_CORE` to 0 and, on Linux, `PR_SET_DUMPABLE` to 0; macOS also gets `PT_DENY_ATTACH`. A copy the Go garbage collector made before the lock is not locked, system limits (`RLIMIT_MEMLOCK`, the Windows working set) still apply, and on Windows a debugger of the same user or an administrator can still read the process. The same module holds the https-or-loopback redirect rule (`redirect`) and the atomic private file write (`privfile`); `theca --mlock` uses it since v0.31.0."

