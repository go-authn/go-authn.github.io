baseURL = "https://go-authn.github.io/"
title = "go-authn"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

[markup.goldmark.renderer]
  unsafe = true

# Each repo card.
# "kind"  = which slice: protocol / factor / policy / identity / server.
# "type"  = lib (importable module) vs tool.
# "ci"    = true only where a GitHub Actions ci.yml actually exists, so the CI
#           badge never renders an empty "no status" -- honest badges only.
# "godoc" = true only where a module is PUBLISHED, so the card never links to a
#           pkg.go.dev 404; a repo without one links to itself. Same rule as ci.
# "cov"   = what CI enforces, not what was measured on somebody's laptop: an
#           exact 100% where the gate refuses anything less, and the recorded
#           floor otherwise. The standard is 100% everywhere; three repos do not
#           meet it yet and the badge says so rather than rounding up.
# "blurb" = drawn straight from each repo's README.

# --- the factors: is this person here, now? -----------------------------------
[[params.repos]]
  name = "fido"
  kind = "protocol"
  type = "lib"
  version = "v0.5.0"
  ci = true
  godoc = true
  cov = "100%"
  blurb = "The FIDO client-to-authenticator protocol over any transport: CTAPHID framing, the handshake, `GetInfo`, `MakeCredential`, `GetAssertion`, `ClientPIN`, and the authenticator data parsed down to a `*ecdsa.PublicKey`."
[[params.repos]]
  name = "mfa"
  kind = "policy"
  type = "lib"
  version = "v0.2.0"
  ci = true
  godoc = true
  cov = "100%"
  blurb = "How many factors, of which kinds, and what to say when some refuse. A factor that could not be asked has not failed; a factor not reached is not reported as failed; and there is no default policy."
[[params.repos]]
  name = "keyfactor"
  kind = "factor"
  type = "lib"
  version = "v0.1.0"
  ci = true
  godoc = true
  cov = "100%"
  blurb = "The piece between the two: a security key as an `mfa.Factor`, over any transport. It lived in a platform package until a second copy was about to be written that differed in one line."
[[params.repos]]
  name = "totp"
  kind = "factor"
  type = "lib"
  version = "v0.1.0"
  ci = true
  godoc = true
  cov = "≥95%"
  blurb = "Time-based one-time passwords (RFC 6238), and the factor a policy asks. A code is valid for a whole step, so the RFC requires the verifier to refuse a second use of one -- and every step up to the last accepted, not merely the same one."

# --- the identity: who is this person, and what would prove them? -------------
[[params.repos]]
  name = "directory"
  kind = "identity"
  type = "lib"
  version = "v0.7.0"
  ci = true
  godoc = true
  cov = "≥85%"
  blurb = "Who somebody is and what proves them, over a database (`sqldir`), an LDAP server (`ldapdir`), or the configuration file itself (`hcldir`). What proves somebody is not one thing: an LDAP bind cannot authenticate an SMB session, and neither can a bcrypt."
[[params.repos]]
  name = "oidc"
  kind = "identity"
  type = "lib"
  version = "v0.1.0"
  ci = true
  godoc = true
  cov = "≥90%"
  blurb = "An OpenID Connect token verified into an identity: discovery, JWKS, and the refusals that matter. For the things that speak a token instead of a directory."
[[params.repos]]
  name = "ldap"
  kind = "protocol"
  type = "lib"
  version = "v0.1.0"
  ci = true
  godoc = true
  cov = "99.9%"
  blurb = "The LDAP protocol half that `authnd` runs: the wire, the filter, the scope, the root DSE. One filter tree feeds matching, the string form and the bytes, so the three cannot drift apart and answer a BROADER question than the one asked -- which is what a directory's disclosure bugs are made of. Written from RFC 4511/4513/4515/7628 and judged by OpenLDAP's own ldapsearch."
[[params.repos]]
  name = "authnd"
  kind = "server"
  type = "tool"
  version = "v0.3.0"
  ci = true
  godoc = false
  cov = "≥80%"
  blurb = "An LDAP server for people who are somewhere else -- a SQL database, a configuration file, another directory -- because almost everything speaks LDAP. The second factor goes on the end of the password, which is the only field a simple bind has. With a `kerberos` block it is a KDC as well, for the same people; `authnd check` names the ones a realm could never issue a ticket to."

# --- the service side: a client proving itself to a service you run -----------
[[params.repos]]
  name = "krb5"
  kind = "protocol"
  type = "lib"
  version = "v0.2.1"
  ci = true
  godoc = true
  cov = "≥90%"
  blurb = "The accepting half of Kerberos: an AP-REQ verified against a keytab and answered with the AP-REP `gokrb5` refuses to build -- without which a GSS-API client asking for mutual authentication completes no context at all. Signs and seals messages too, so `sec=krb5`, `sec=krb5i` and `sec=krb5p`. It issues nothing; that is kdc."

[[params.repos]]
  name = "kdc"
  kind = "protocol"
  type = "lib"
  version = "v0.1.0"
  ci = true
  godoc = true
  cov = "≥80%"
  blurb = "The issuing half: AS-REQ and TGS-REQ over UDP and TCP, backed by the same people authnd already publishes. Judged by MIT's own kinit and kvno, with no MIT KDC involved. Only a source holding the PASSWORD can back a realm -- a KDC decrypts the pre-authentication, and a verifier answers a yes, not a key."

# The .road section, driven the way the reference drives its phases: name,
# status (ready | active), blurb. The template shows the first sentence.
# "active" is used for what is NOT yet done, which is what the repos' own
# READMEs call "Not yet".
[[params.phases]]
  name = "The factors"
  status = "ready"
  blurb = "`fido` speaks CTAPHID to a security key over any transport, `totp` is RFC 6238 with the replay refusal the RFC requires, and `mfa` counts answers by KIND rather than by number. `keyfactor` is the piece between them."
[[params.phases]]
  name = "The directory"
  status = "ready"
  blurb = "`directory` is one model over a database, an LDAP server or the configuration file itself, carrying what PROVES each person rather than a password field. `authnd` serves it back out over LDAP, because almost everything speaks LDAP."
[[params.phases]]
  name = "Kerberos, both halves"
  status = "ready"
  blurb = "`kdc` issues AS-REQ and TGS-REQ from that same directory, judged by MIT's own kinit. `krb5` accepts an AP-REQ and answers with the AP-REP gokrb5 will not build, then signs and seals for sec=krb5, krb5i and krb5p."
[[params.phases]]
  name = "The platform's own factors"
  status = "ready"
  blurb = "go-macos/factors, go-gnulinux/factors and go-mswin/factors hand Touch ID, a key over hidraw and Windows Hello to `mfa` as factors. Neither Hello nor Touch ID is FIDO, which is why kinds are counted."
[[params.phases]]
  name = "OIDC at the bind"
  status = "ready"
  blurb = "A token goes where the protocol has a place for it: SASL OAUTHBEARER (RFC 7628), not the password field, which the `mfa` block already uses for the code. How many factors a token is worth is whatever the issuer says it checked in `amr` -- that is the only evidence there is, so a token with none is one factor and a two-factor policy refuses it."
[[params.phases]]
  name = "Writes through the LDAP surface"
  status = "active"
  blurb = "Nothing in `authnd` modifies anything yet, but the obstacle has moved. It was the shape: the LDAP library it used held a modify as three BUCKETS, so `delete member; add member` and `add member; delete member` -- opposite outcomes -- arrived as the same request. `go-authn/ldap` carries them as an ordered list, which is what RFC 4511 4.6 requires and what makes a correct write expressible at all."
