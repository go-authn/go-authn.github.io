baseURL = "https://go-authn.github.io/"
title = "go-authn"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

[markup.goldmark.renderer]
  unsafe = true

# Each repo card.
#
# ⛔ ONLY "name" AND "blurb" ARE RENDERED. The template shows the repo's name
# and the first sentence of its blurb; nothing else on this list reaches the
# page.
#
# The other fields described badges that the template no longer draws. They
# were removed in #16, which rebuilt this page to the reference's skeleton
# exactly -- and the DATA was left behind, along with a comment block saying
# what the badges would show. It was then dutifully updated in three later
# changes, each one describing the update as making the page current, when it
# changed nothing anybody sees.
#
# They are kept because they are a true record of each repo and the badges may
# come back. But the comment now says what is so:
#
# "kind"  = which slice: protocol / factor / policy / identity / server.
#           NOT RENDERED -- the sections are written out in the template.
# "type"  = lib (importable module) vs tool.       NOT RENDERED.
# "ci"    = a GitHub Actions ci.yml exists.        NOT RENDERED.
# "godoc" = the module is published on pkg.go.dev. NOT RENDERED.
# "cov"   = what CI ENFORCES, not what was measured on somebody's laptop.
#           RENDERED ONLY AS "100%": the stats line names every repo whose
#           value is exactly that, so a gate raised to 100% must say so here.
# "version" was REMOVED on 2026-10-04. Nothing ever rendered it, and it could
#           not be kept true: #35 brought all of them up to date, #37 had to
#           correct servercert straight after, and bridge was stale again
#           within the hour (v0.12.0 here, v0.13.0 on GitHub). The tag is on
#           GitHub, which is the one copy that cannot drift from itself.
# "name"  = RENDERED, as the card's heading; the count of entries is a stat.
# "blurb" = RENDERED, first sentence only, drawn from each repo's README.

# --- the factors: is this person here, now? -----------------------------------
[[params.repos]]
  name = "fido"
  kind = "protocol"
  type = "lib"
  ci = true
  godoc = true
  cov = "100%"
  blurb = "The FIDO client-to-authenticator protocol over any transport: CTAPHID framing, the handshake, `GetInfo`, `MakeCredential`, `GetAssertion`, `ClientPIN`, and the authenticator data parsed down to a `*ecdsa.PublicKey`."
[[params.repos]]
  name = "mfa"
  kind = "policy"
  type = "lib"
  ci = true
  godoc = true
  cov = "100%"
  blurb = "How many factors, of which kinds, and what to say when some refuse. A factor that could not be asked has not failed; a factor not reached is not reported as failed; and there is no default policy."
[[params.repos]]
  name = "keyfactor"
  kind = "factor"
  type = "lib"
  ci = true
  godoc = true
  cov = "100%"
  blurb = "The piece between the two: a security key as an `mfa.Factor`, over any transport. It lived in a platform package until a second copy was about to be written that differed in one line."
[[params.repos]]
  name = "totp"
  kind = "factor"
  type = "lib"
  ci = true
  godoc = true
  cov = "≥95%"
  blurb = "Time-based one-time passwords (RFC 6238), and the factor a policy asks. A code is valid for a whole step, so the RFC requires the verifier to refuse a second use of one -- and every step up to the last accepted, not merely the same one."

# --- the identity: who is this person, and what would prove them? -------------
[[params.repos]]
  name = "directory"
  kind = "identity"
  type = "lib"
  ci = true
  godoc = true
  cov = "≥85%"
  blurb = "Who somebody is and what proves them, over a database (`sqldir`), an LDAP server (`ldapdir`), or the configuration file itself (`hcldir`). What proves somebody is not one thing: an LDAP bind cannot authenticate an SMB session, and neither can a bcrypt."
[[params.repos]]
  name = "oidc"
  kind = "identity"
  type = "lib"
  ci = true
  godoc = true
  cov = "≥90%"
  blurb = "An OpenID Connect token verified into an identity: discovery, JWKS, and the refusals that matter. For the things that speak a token instead of a directory."
[[params.repos]]
  name = "saml"
  kind = "identity"
  type = "lib"
  ci = true
  godoc = true
  cov = "≥92%"
  blurb = "A SAML 2.0 service provider in a federation such as RENATER or eduGAIN: metadata verified against a pinned certificate, one signed assertion and nothing else, and scoped identifiers only in the scopes the federation grants each university. Judged by RENATER's own signed metadata and by xmlsec1."
[[params.repos]]
  name = "bridge"
  kind = "server"
  type = "tool"
  ci = true
  godoc = false
  cov = "≥88%"
  blurb = "An OpenID Connect provider in front of a SAML federation: people log in at their own university, and applications get a token. Device grant, SSH certificates and application passwords for the protocols that cannot carry one, and what OpenPubkey needs of a provider -- judged by the openpubkey library itself."
[[params.repos]]
  name = "ldap"
  kind = "protocol"
  type = "lib"
  ci = true
  godoc = true
  cov = "99.7%"
  blurb = "The LDAP protocol half that `authnd` runs: the wire, the filter, the scope, the root DSE, paged results and the read entry controls. One filter tree feeds matching, the string form and the bytes, so the three cannot drift apart and answer a BROADER question than the one asked -- which is what a directory's disclosure bugs are made of. Written from RFC 4511/4512/4513/4514/4515/2696/4527 and judged by OpenLDAP's own ldapsearch, which reads back the supportedControl and supportedFeatures it publishes. SASL binds are carried mechanism-agnostically, so OAUTHBEARER (RFC 7628) is authnd's, not this package's."
[[params.repos]]
  name = "authnd"
  kind = "server"
  type = "tool"
  ci = true
  godoc = false
  cov = "≥88%"
  blurb = "An LDAP server for people who are somewhere else -- a SQL database, a configuration file, another directory -- because almost everything speaks LDAP. The second factor goes on the end of the password, which is the only field a simple bind has. With a `kerberos` block it is a KDC as well, for the same people; `authnd check` names the ones a realm could never issue a ticket to."

# --- the service side: a client proving itself to a service you run -----------
[[params.repos]]
  name = "krb5"
  kind = "protocol"
  type = "lib"
  ci = true
  godoc = true
  cov = "≥90%"
  blurb = "The accepting half of Kerberos: an AP-REQ verified against a keytab and answered with the AP-REP `gokrb5` refuses to build -- without which a GSS-API client asking for mutual authentication completes no context at all. Signs and seals messages too, so `sec=krb5`, `sec=krb5i` and `sec=krb5p`. It issues nothing; that is kdc."

[[params.repos]]
  name = "kdc"
  kind = "protocol"
  type = "lib"
  ci = true
  godoc = true
  cov = "≥80%"
  blurb = "The issuing half: AS-REQ and TGS-REQ over UDP and TCP, backed by the same people authnd already publishes. Judged by MIT's own kinit and kvno, with no MIT KDC involved. Only a source holding the PASSWORD can back a realm -- a KDC decrypts the pre-authentication, and a verifier answers a yes, not a key."

# --- revocation: taking back what was issued, on every server ----------------
[[params.repos]]
  name = "krl"
  kind = "protocol"
  type = "lib"
  ci = true
  godoc = true
  cov = "100%"
  blurb = "OpenSSH key revocation lists in Go: parse, build and check the binary format sshd loads through `RevokedKeys` and `ssh-keygen -k` writes, which `golang.org/x/crypto/ssh` does not support. Judged by OpenSSH's own ssh-keygen, which writes the same bytes for the same revocations."
[[params.repos]]
  name = "revocation"
  kind = "server"
  type = "tool"
  ci = true
  godoc = true
  cov = "≥93%"
  blurb = "Distributing revocation lists, SSH KRLs and X.509 CRLs, from the authority that writes them to every server that must refuse what they list, without trusting anything in between and without ever mistaking a stale list for a current one. `authn-revokd` fetches, verifies, keeps state across restarts, fails closed for sshd when a list lapses, and mirrors to other agents."
[[params.repos]]
  name = "servercert"
  kind = "server"
  type = "lib"
  ci = true
  godoc = true
  cov = "100%"
  blurb = "Where a daemon's TLS server certificate comes from: a certificate and key on disk, re-read when they change, or an ACME CA through autocert, External Account Binding included."


# --- a VPN on the same identity ---------------------------------------------
[[params.repos]]
  name = "wireguard"
  kind = "protocol"
  type = "lib"
  ci = true
  godoc = true
  cov = "100%"
  blurb = "WireGuard public keys for the people a go-authn provider knows: what a key is -- one canonical spelling, never a point of low order -- and the signed list of the keys people registered, which a gateway pulls with its own credentials and never accepts older than one it has seen. Judged by wg(8) itself."

# --- SSH for the EuroHPC federation ------------------------------------------
[[params.repos]]
  name = "sshcert"
  kind = "protocol"
  type = "lib"
  ci = true
  godoc = true
  cov = "100%"
  blurb = "SSH user certificates for a federation: the domain grant of the GÉANT/EuroHPC SSH CA profile, encoded byte for byte as its specification writes it, and sshcert-authorize, the site's AuthorizedPrincipalsCommand -- which, unlike GÉANT's own tool, refuses a certificate that carries no grant. Judged by ssh-keygen, a real sshd and GÉANT's code."

# The .road section, driven the way the reference drives its phases: name,
# status (ready | active), blurb. The template shows the first sentence.
# "active" is used for what is NOT yet done, which is what the repos' own
# READMEs call "Not yet".
[[params.phases]]
  name = "The factors"
  status = "ready"
  blurb = "`fido` speaks CTAPHID to a security key over any transport, `totp` is RFC 6238 with the replay refusal the RFC requires, and `mfa` counts answers by KIND rather than by number. `keyfactor` is the piece between them."
[[params.phases]]
  name = "The directory"
  status = "ready"
  blurb = "`directory` is one model over a database, an LDAP server or the configuration file itself, carrying what PROVES each person rather than a password field. `authnd` serves it back out over LDAP, because almost everything speaks LDAP."
[[params.phases]]
  name = "Kerberos, both halves"
  status = "ready"
  blurb = "`kdc` issues AS-REQ and TGS-REQ from that same directory, judged by MIT's own kinit. `krb5` accepts an AP-REQ and answers with the AP-REP gokrb5 will not build, then signs and seals for sec=krb5, krb5i and krb5p."
[[params.phases]]
  name = "The platform's own factors"
  status = "ready"
  blurb = "go-macos/factors, go-gnulinux/factors and go-mswin/factors hand Touch ID, a key over hidraw and Windows Hello to `mfa` as factors. Neither Hello nor Touch ID is FIDO, which is why kinds are counted."
[[params.phases]]
  name = "OIDC at the bind"
  status = "ready"
  blurb = "A token goes where the protocol has a place for it: SASL OAUTHBEARER (RFC 7628), not the password field, which the `mfa` block already uses for the code. How many factors a token is worth is whatever the issuer says it checked in `amr` -- that is the only evidence there is, so a token with none is one factor and a two-factor policy refuses it."
[[params.phases]]
  name = "A federation behind OpenID Connect"
  status = "ready"
  blurb = "`saml` is the service provider RENATER and eduGAIN talk to, `bridge` the OpenID Connect provider in front of it, so that go-fileshare and anything else that speaks OIDC reaches every university in the federation. A token over WebDAV, a certificate over SFTP -- the provider's own or an opkssh one -- and an application password for SMB and S3, which have nowhere to put either."
[[params.phases]]
  name = "Revocation that reaches every server"
  status = "ready"
  blurb = "`bridge` signs its KRL and CRL and dates them, `authn-revokd` verifies each before any server sees it, refuses an older one after a newer, and fails closed for sshd when the list lapses. Copying list files by hand does not scale, and a mirror in between is trusted for nothing."
[[params.phases]]
  name = "A VPN on the same identity"
  status = "ready"
  blurb = "`bridge` keeps whose each WireGuard key is: a person's VPN client registers its device's public key with a token, for a lease, and disabling the person or their institution takes the keys back with their certificates. A gateway -- claimward's, first -- reads the live keys as a list signed for it alone, through `wireguard`, and enrolls a device only if its owner registered it. WireGuard itself has no certificates, no expiry and no revocation, which is why the answer has to live outside it."
[[params.phases]]
  name = "The EuroHPC SSH CA profile"
  status = "ready"
  blurb = "`bridge` issues, per client, certificates in the profile of the EuroHPC Federation Platform's SSH CA: one principal from a chosen claim (`voperson_id` for the MyAccessID CUID), the permit-* a shell needs, `source-address`, a short validity, and the domain grant naming the hosting entity's hosts, encoded by `sshcert`. A site trusts the key from `/ssh/config` as EFP documents, and go-fileshare refuses a certificate not granted to it. Unlike GÉANT's tool, ours fail closed when the grant is missing, and the bridge keeps a KRL, which EFP documents none of."
[[params.phases]]
  name = "Writes through the LDAP surface"
  status = "active"
  blurb = "A person can change their own password in `authnd`, with the current one (RFC 3062, or a modify of their own `userPassword`), and nothing else is written: add, delete and modifyDN are deliberately not wired, and the obstacle is now policy rather than shape. `go-authn/ldap` carries a modify as an ORDERED list (RFC 4511 4.6), so `delete member; add member` and `add member; delete member` are no longer the same request; and it answers the read entry controls (RFC 4527), so a write can report the entry before and after -- which a client changing a group membership needs in order to know what it actually wrote."
