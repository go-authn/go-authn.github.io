name: links

# A dead link on a landing page breaks nothing that complains (the landing once
# linked https://github.com/go-fileshare/authnd, a 404), so every link of the
# page is checked.
#
# ⛔ THE CHECK READS THE BUILT SITE, NOT THE LAYOUTS: templated links such as
# the per-repository cards only become real URLs once Hugo has expanded them.
#
# The checker is `landingkit links` (go-fleettools/landingkit), run at the
# version go.mod pins: it replaces a hand-written curl loop.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: every link and image resolves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      # Hugo resolves the landingkit module (hugo.toml [module]) with the go
      # command, at the version go.mod pins.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: peaceiris/actions-hugo@d1c81a15d4e6dca7086a17b9c2565cb70fd576bf # v3
        with:
          hugo-version: "0.169.0"
          extended: true
      - run: hugo --minify --destination ./public
      - name: Check
        env:
          GOWORK: "off"
        run: go run github.com/go-fleettools/landingkit/cmd/landingkit links public
